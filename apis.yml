aid: sumeria
name: Sumeria
description: 'Sumeria is a French fintech and mobile-first banking service created by Lydia
  Solutions in 2024 as a consumer spinoff of the Lydia payment app. It offers free online
  banking accounts with automatic expense categorization, thematic sub-accounts for budgeting
  and savings, virtual and physical debit cards with no foreign-exchange fees, an interest-bearing
  balance, and an AI assistant named Sia for account management and financial guidance.
  Sumeria is a business-to-consumer banking product; it publishes no public developer API,
  developer portal, or API documentation at this time, so this API Evangelist profile captures
  its company identity and domain-security posture rather than an API surface.'
